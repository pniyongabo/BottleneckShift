[experiment]
name = "milestone1_concurrency"
repetitions = 3

[server]
model = "Qwen/Qwen2.5-0.5B-Instruct"
host = "127.0.0.1"
port = 8000
tensor_parallel_size = 1
gpu_memory_utilization = 0.90
startup_timeout_seconds = 600

[workload]
num_prompts = 100
input_tokens = 256
output_tokens = 128
seed = 2027

[[condition]]
name = "baseline_c1"
max_concurrency = 1

[[condition]]
name = "perturbation_c8"
max_concurrency = 8
